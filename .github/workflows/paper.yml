name: paper-session
on:
  schedule:
    - cron: "50 5 * * 1-5"
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill, session or check"
        default: "backfill"
permissions:
  contents: write
concurrency: paper
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - run: python paper_trader.py ${{ github.event.inputs.mode || 'session' }}
      - name: Save results
        if: always()
        run: |
          git config user.name "tradepilot-bot"
          git config user.email "bot@users.noreply.github.com"
          cp data/state.json /tmp/state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/state.json data/state.json
          git add data
          git diff --cached --quiet || (git commit -m "results $(date -u +%F)" && git push)
